[Service]
TimeoutStartSec=120
ExecStartPre=/bin/bash -c 'for i in $(seq 1 90); do if /usr/bin/curl -fsS --max-time 2 http://127.0.0.1:20128/api/monitoring/health >/dev/null; then echo "OmniRoute is healthy"; exit 0; fi; echo "Waiting for OmniRoute... ($i/90)"; sleep 1; done; echo "OmniRoute did not become healthy within 90 seconds" >&2; exit 1'
