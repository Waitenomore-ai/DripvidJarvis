# DripVid JARVIS — nginx location block (dripvid.uk)
#
# Place inside the dripvid.uk :443 server block, then validate:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requirement: docker/containers must reach the host. If nginx runs in a
# container, use the host gateway IP (e.g. host.docker.internal or 172.17.0.1)
# instead of 127.0.0.1 in proxy_pass.

location ^~ /jarvis/ {
    proxy_pass http://127.0.0.1:3342/;   # trailing slash strips the /jarvis/ prefix

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- Access gate (pick ONE) ----
    # (1) RECOMMENDED: HTTP basic auth (independent of DripVid accounts).
    #     Create the password file once:
    #       sudo htpasswd -c /etc/nginx/.htpasswd-jarvis <admin-user>
    #     Remove the leading '#' on the two lines below.
    # auth_basic "JARVIS Operator Access";
    # auth_basic_user_file /etc/nginx/.htpasswd-jarvis;

    # (2) ALTERNATIVE: Cloudflare Access (fronts dripvid.uk already).
    #     Move JARVIS behind an Access app for /jarvis/* and add:
    #       access_by_lua_block {
    #         local ok, err = require("resty.jwt"):verify(
    #           "ENV.CF_ACCESS_AUD", ngx.var.http_cf_access_jwt_assertion)
    #         if not ok then ngx.exit(ngx.HTTP_FORBIDDEN) end
    #       }
    #     (requires lua-resty-jwt; do NOT combine with auth_basic)

    # Optional hardening while JARVIS binds loopback only:
    # allow 127.0.0.1;
    # deny  all;   (leave commented — would block public access)

    # Optional: WebSocket upgrades if voice/streaming features are added later.
    # proxy_http_version 1.1;
    # proxy_set_header Upgrade $http_upgrade;
    # proxy_set_header Connection "upgrade";
}