<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">DripVid</title>
  <desc id="desc">DripVid neon play mark and white wordmark on a transparent background.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.35" stop-color="#6d5dfc"/>
      <stop offset="0.68" stop-color="#c13cff"/>
      <stop offset="1" stop-color="#ff3f91"/>
    </linearGradient>
    <linearGradient id="brandReverse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3f91"/>
      <stop offset="0.52" stop-color="#b63cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#fbfaff"/>
      <stop offset="1" stop-color="#d9d5ff"/>
    </linearGradient>
    <radialGradient id="iconFill" cx="42%" cy="34%" r="78%">
      <stop offset="0" stop-color="#241446"/>
      <stop offset="0.62" stop-color="#100b24"/>
      <stop offset="1" stop-color="#07080d"/>
    </radialGradient>
    <filter id="iconGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.55 0 0.45 0 0 0.1 0 0 1 0 0.7 0 0 0 0.65 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wordShadow" x="-15%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#8b5cf6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g transform="translate(18 15)" filter="url(#iconGlow)">
    <path d="M132 6C166 6 197 24 216 55L266 138C282 164 282 196 267 221C252 246 225 261 195 261H72C42 261 15 246 1 221C-14 196-14 165 1 139L51 55C69 25 98 7 132 6Z" fill="url(#iconFill)" stroke="url(#brandReverse)" stroke-width="17" stroke-linejoin="round"/>
    <path d="M130 18C106 19 84 32 70 55L21 141C10 160 8 180 17 198" fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round" opacity="0.95"/>
    <path d="M145 19C172 22 195 39 209 63L255 140C266 158 268 176 263 191" fill="none" stroke="#ff3f91" stroke-width="9" stroke-linecap="round" opacity="0.95"/>
    <path d="M105 80C105 69 117 63 126 69L190 107C199 113 199 126 190 132L126 170C117 176 105 169 105 158Z" fill="url(#brand)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>
    <path d="M118 76L179 112" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
  </g>

  <g filter="url(#wordShadow)">
    <text x="318" y="190" fill="url(#word)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.3" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="146" font-weight="900" letter-spacing="-9">DripVid</text>
  </g>
</svg>
