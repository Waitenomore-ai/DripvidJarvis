<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JARVIS Agent Deck</title>
  <link rel="icon" type="image/svg+xml" href="dripvid-icon.svg">
  <link rel="stylesheet" href="agents.css?v=2">
</head>
<body>
  <div class="deck-frame">
    <div class="corner topleft"></div>
    <div class="corner topright"></div>
    <div class="corner bottomleft"></div>
    <div class="corner bottomright"></div>

    <header class="deck-topbar">
      <a class="brand" href="index.html">
        <img src="dripvid-logo.svg" alt="DripVid">
        <div>
          <strong>J.A.R.V.I.S.</strong>
          <span>AGENT COMMAND DECK</span>
        </div>
      </a>
      <div class="deck-status">
        <span class="sys-status" id="sysStatus"><i></i>Linking</span>
        <span class="clock" id="deckClock">--:--:--</span>
        <a class="exit" href="index.html">Exit deck</a>
      </div>
    </header>

    <main class="deck-body">
      <section class="control-deck" aria-label="Dispatch controls">
        <div class="control-block">
          <p class="eyebrow">AUTO DELEGATION</p>
          <label class="switch">
            <input type="checkbox" id="autoDelegate">
            <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
            <span class="switch-label" id="autoLabel">Off - dispatch by hand</span>
          </label>
        </div>

        <form class="dispatch-form" id="dispatchForm">
          <p class="eyebrow">MANUAL DISPATCH</p>
          <div class="dispatch-row">
            <label class="field">
              <span>Agent</span>
              <select id="dispatchEmployee" required></select>
            </label>
            <label class="field grow">
              <span>Task</span>
              <input id="dispatchTitle" type="text" maxlength="120" required placeholder="Draft the release notes">
            </label>
            <label class="field grow">
              <span>Detail</span>
              <input id="dispatchDetail" type="text" maxlength="600" placeholder="Anything the agent should know">
            </label>
            <button class="ghost-btn dispatch-btn" type="submit" id="dispatchBtn">Dispatch</button>
          </div>
        </form>
      </section>

      <section class="defect-banner" id="defectBanner" hidden aria-live="polite"></section>

      <section class="agents-grid" id="agentsGrid" aria-label="Agents"></section>

      <section class="ops-row">
        <section class="panel ops-log-panel" aria-labelledby="opsTitle">
          <div class="panel-head">
            <div>
              <p class="eyebrow">OPERATIONS FEED</p>
              <h2 id="opsTitle">Live Agent Activity</h2>
            </div>
            <span class="live-badge"><i></i>LIVE</span>
          </div>
          <div id="opsLog" class="ops-log">
            <p class="muted">Waiting for the first event.</p>
          </div>
        </section>

        <section class="panel mission-panel" aria-labelledby="missionTitle">
          <div class="panel-head">
            <div>
              <p class="eyebrow">APPROVAL GATE</p>
              <h2 id="missionTitle">Pending Missions</h2>
            </div>
            <button id="refreshMissions" class="ghost-btn" type="button">Refresh</button>
          </div>
          <div id="missionQueue" class="mission-queue">
            <p class="muted">No pending confirmations.</p>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script src="agents.js?v=2"></script>
</body>
</html>
